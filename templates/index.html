<!DOCTYPE html>
<html>
<head>
    <title>BnuuyBot Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Jua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <h1>BunnyBot Chat</h1>
    <div class="container">
        <div class="sidebar">
            <div id="status" style="text-align: center;">
                <div>
                    Listening (mic): 
                    <span class="status-indicator {% if is_active %}status-active{% else %}status-inactive{% endif %}"></span>
                    {% if is_active %}Active{% else %}Inactive{% endif %}
                </div>
                <!-- Commented out timer status since we removed self-prompting
                <div>
                    Self-prompting (timer): 
                    <span class="status-indicator {% if timer_active %}status-active{% else %}status-inactive{% endif %}"></span>
                    {% if timer_active %}Active{% else %}Inactive{% endif %}
                </div>
                -->
            </div>
            
            <div class="sidebar-section">
                <form id="mic-form" action="{% if is_active %}/stop_listening{% else %}/start_listening{% endif %}" method="post">
                    <button type="submit" 
                            class="icon-button {% if is_active %}btn-mic-on{% else %}btn-mic-off{% endif %}"
                            title="{% if is_active %}Stop listening{% else %}Start listening{% endif %}">
                        <i class="fa-solid {% if is_active %}fa-microphone{% else %}fa-microphone-slash{% endif %}"></i>
                    </button>
                </form>
                
                <form id="end-chat-form" action="/shutdown" method="post">
                    <button type="submit" class="icon-button btn-end" title="Shut down the application">
                        <i class="fa-solid fa-power-off"></i>
                    </button>
                </form>
            </div>
            
            <h3>Chat History</h3>
            <div class="history-controls">
                <button type="button" class="icon-button btn-load" title="Load chat history">
                    <i class="fa-solid fa-folder-open"></i>
                </button>
                
                <form id="clear-chat-form" action="/clear" method="post">
                    <button type="submit" class="icon-button btn-clear" title="Clear chat window">
                        <i class="fa-solid fa-eraser"></i>
                    </button>
                </form>
                
                <form id="reset-chat-form" action="/reset_chat" method="post">
                    <button type="submit" class="icon-button btn-reset" title="Reset chat history and context">
                        <i class="fa-solid fa-rotate-left"></i>
                    </button>
                </form>
            </div>
            
            <!-- Hidden history list that appears when Load button is clicked -->
            <div id="history-list" class="history-list" style="display: none;">
                <div class="history-list-header">
                    <h4>Select Chat History</h4>
                    <button type="button" class="icon-button btn-close" onclick="toggleHistoryList()">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div id="history-files">
                    <!-- History files will be loaded here via AJAX -->
                    <p class="loading-text">Loading histories...</p>
                </div>
            </div>
            
            <!-- Commented out user profile section
            <div class="sidebar-section">
                <form id="user-id-form" action="/set_user_id" method="post">
                    <div class="input-with-button">
                        <label for="user_id">User ID:</label>
                        <input type="text" id="user_id" name="user_id" value="{{ default_user_id }}">
                        <button type="submit" class="icon-button btn-user-id">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                    </div>
                </form>
            </div>
            -->
            
            <!-- for testing purposes later on. -->
            <!-- <div class="sidebar-section">
                <form>
                    <button type="button" onclick="addTestSystemMessage()">Add Test System Message</button>
                </form>
            </div> -->
        </div>

        <div class="main-content">
            <div class="conversation-container">
                <div id="conversation">
                    {% if history or llm_responses %}
                    {% else %}
                        <p>No conversation history yet. Start speaking to begin.</p>
                    {% endif %}
                </div>
                <div class="text-input-container">
                    <form id="text-message-form" action="/send_text" method="post">
                        <textarea id="message_text" name="message_text" placeholder="Type a message..." rows="1"></textarea>
                        <button type="submit" class="send-button" title="Send message">
                            <i class="fa-regular fa-paper-plane"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/ajax.js') }}"></script>
</body>
</html>
